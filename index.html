<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Dice Game</title>
    <link rel="icon" type="image/png" href="./images/game-die.png">
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P|Young+Serif"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Dice Game</h1>

      <div class="flag">
        <img class="flag2" src="./images/flag2.png" alt="flag2">
      </div>

      <div class="dice">
        <p>Player 1</p>
        <img class="img1" src="./images/dice6.png" />
      </div>

      <div class="dice">
        <p>Player 2</p>
        <img class="img2" src="./images/dice6.png" />
      </div>

      <div class="flag">
        <img class="flag1" src="./images/flag1.png" alt="flag1">
      </div>

    </div>

    <div class="button-container">
        <a class="btn" onclick="playRandomizer()">Play</a>
    </div>

    <script src="index.js" charset="utf-8"></script>
  </body>
</html>
